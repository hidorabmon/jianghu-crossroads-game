function makeStats(){let a={};statNames.forEach(n=>a[n]=45+Math.floor(Math.random()*41));let best=statNames.reduce((x,y)=>a[x]>a[y]?x:y);if(a[best]<75)a[best]=75;let lows=statNames.filter(n=>a[n]<50);lows.slice(1).forEach(n=>a[n]=50+Math.floor(Math.random()*8));return a}
function initVitals(){state.maxHp=85+Math.round(state.stats.根骨*.45);state.hp=state.maxHp;state.maxQi=50+Math.round((state.stats.悟性+state.stats.定力)*.28);state.qi=state.maxQi}
function applyFx(fx={}){for(const [k,v] of Object.entries(fx)){if(statNames.includes(k))state.stats[k]=Math.min(99,state.stats[k]+v);else if(k==='tag'&&!state.tags.includes(v))state.tags.push(v);else if(k==='item'&&!state.items.includes(v))state.items.push(v);else if(k==='technique'&&!state.techniques.includes(v))state.techniques.push(v)}}
function renderStats(){stats.innerHTML=statNames.map(n=>`<div><div class="stathead"><span>${n}</span><b>${state.stats[n]}</b></div><div class="bar"><div class="fill" style="width:${state.stats[n]}%"></div></div></div>`).join('');const all=[...state.tags,...state.techniques.map(x=>'武·'+x),...state.items.map(x=>'◆ '+x)];tags.innerHTML=all.map(x=>`<span class="tag">${x}</span>`).join('');fate.textContent=`氣血 ${Math.max(0,state.hp)}/${state.maxHp} · 內力 ${Math.max(0,state.qi)}/${state.maxQi}`}
function render(){const s=scenes[state.scene];chapter.textContent=s.chapter;title.textContent=s.title;speaker.textContent=s.speaker;text.textContent=s.text;dialogue.classList.remove('fade');void dialogue.offsetWidth;dialogue.classList.add('fade');choices.innerHTML='';combatHud.hidden=true;if(s.combat){renderCombat(s)}else if(s.end){const b=document.createElement('button');b.className='choice';b.innerHTML='再開一局<span class="hint">重新生成命格，探索另一條江湖路</span>';b.onclick=restart;choices.appendChild(b)}else{s.choices.forEach(c=>{const ok=!c.need||state.stats[c.need]>=c.min;const b=document.createElement('button');b.className='choice';b.disabled=!ok;b.style.opacity=ok?'1':'.48';b.innerHTML=`${c.label}<span class="hint">${ok?c.hint:`需要 ${c.need} ≥ ${c.min}`}</span>`;if(ok)b.onclick=()=>choose(c);choices.appendChild(b)})}renderStats()}
function choose(c){state.history.push({scene:state.scene,choice:c.label});applyFx(c.fx);state.scene=c.to;state.combat=null;eventlog.textContent=c.fx?.item?`獲得：${c.fx.item}`:c.fx?.technique?`習得：${c.fx.technique}`:`命途變化：${c.fx?.tag||'新的線索'}`;save();render()}
function renderCombat(s){if(!state.combat||state.combat.scene!==state.scene)state.combat={scene:state.scene,enemy:s.combat.enemy,hp:s.combat.hp,maxHp:s.combat.hp,evade:0,round:1};const c=state.combat;combatHud.hidden=false;combatHud.innerHTML=`<div><strong>你 · 氣血 ${Math.max(0,state.hp)}/${state.maxHp}</strong><div class="combat-bar"><i style="width:${Math.max(0,state.hp/state.maxHp*100)}%"></i></div><div class="combat-bar qi"><i style="width:${Math.max(0,state.qi/state.maxQi*100)}%"></i></div></div><div><strong>${c.enemy} · ${Math.max(0,c.hp)}/${c.maxHp}</strong><div class="combat-bar"><i style="width:${Math.max(0,c.hp/c.maxHp*100)}%"></i></div><small>第 ${c.round} 回合</small></div>`;for(const name of state.techniques){const mv=moves[name];const ok=state.qi>=mv.cost;const b=document.createElement('button');b.className='choice';b.disabled=!ok;b.style.opacity=ok?'1':'.48';b.innerHTML=`施展 ${name}<span class="hint">${mv.desc} · 內力 ${mv.cost}</span>`;if(ok)b.onclick=()=>fight(name,s);choices.appendChild(b)}const rest=document.createElement('button');rest.className='choice';rest.innerHTML='凝神調息<span class="hint">恢復 14–20 內力，但會承受敵人攻擊</span>';rest.onclick=()=>fight('調息',s);choices.appendChild(rest)}
function fight(name,s){const c=state.combat;let log='';if(name==='調息'){const gain=14+Math.floor(Math.random()*7);state.qi=Math.min(state.maxQi,state.qi+gain);log=`你凝神調息，恢復 ${gain} 內力。`}else{const mv=moves[name];state.qi-=mv.cost;const bonus=Math.floor(state.stats[mv.stat]*.11);let dmg=mv.min+Math.floor(Math.random()*(mv.max-mv.min+1))+bonus;if(Math.random()<state.stats.悟性/420){dmg=Math.round(dmg*1.5);log='看破破綻！'}c.hp-=dmg;c.evade=mv.evade||0;log+=`你施展「${name}」，造成 ${dmg} 傷害。`}if(c.hp<=0){state.history.push({scene:state.scene,choice:`戰勝 ${c.enemy}`});state.scene=s.combat.win;state.combat=null;state.hp=Math.min(state.maxHp,state.hp+24);state.qi=Math.min(state.maxQi,state.qi+20);eventlog.textContent=`勝出：${c.enemy}`;save();render();return}const dodge=Math.min(.72,(c.evade||0)+state.stats.身法/500);if(Math.random()<dodge){log+=' 你避開了反擊。'}else{const hurt=Math.max(5,s.combat.attack+Math.floor(Math.random()*9)-Math.floor(state.stats.根骨/18));state.hp-=hurt;log+=` 敵人反擊，造成 ${hurt} 傷害。`}c.evade=0;c.round++;eventlog.textContent=log;if(state.hp<=0){state.hp=Math.round(state.maxHp*.55);state.qi=Math.round(state.maxQi*.45);state.scene=s.combat.lose;state.combat=null;save();render();return}save();render()}
function restart(){state={scene:'intro',stats:makeStats(),tags:['身世未明'],items:[],techniques:['基礎劍法'],history:[],hp:100,maxHp:100,qi:70,maxQi:70,combat:null};initVitals();eventlog.textContent='新的命盤已生成';save();render()}
function save(){localStorage.setItem('wuxia-v11',JSON.stringify(state))}
function toastMsg(m){toast.textContent=m;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1600)}
beginBtn.onclick=()=>{restart();start.classList.add('hidden')};continueBtn.onclick=()=>{start.classList.add('hidden');render()};saveBtn.onclick=()=>{save();toastMsg('進度已封存')};statusBtn.onclick=()=>panel.classList.add('open');panelClose.onclick=()=>panel.classList.remove('open');resetBtn.onclick=()=>{panel.classList.remove('open');restart();start.classList.add('hidden');toastMsg('命盤已重開')};
const saved=localStorage.getItem('wuxia-v11');if(saved){try{state=JSON.parse(saved);render();continueBtn.hidden=false}catch(e){localStorage.removeItem('wuxia-v11')}}if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
